[project]
name = "bot-allert"
version = "0.1.0"
description = "Self-hosted Telegram bot that relays posts from the channels of one folder, silent for muted channels"
requires-python = ">=3.12"
dependencies = ["telethon==1.45.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_allert"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
